# mbproxy.conf for a Waterkotte heat pump with WWPR controller (Carel pCO, firmware 01.05.04),
# BMS menu: Modbus Slave, address 32. In production on the author's Ai1QLi since 2026-10-21.
#
# The controller only has HR 0..249 and coils 0..199 (-a/-k).
# Write allowlist = the registers the author's Home Assistant setup writes:
#   38 hot water setpoint, 61 hysteresis heating, 92 heating circuit setpoint at design temperature,
#   93 heating limit, 94 heating limit setpoint, 107 hysteresis cooling, 108 cooling limit,
#   109 cooling circuit setpoint, 159/160 = I31/I32 BMS switch cooling / hot water.
# -z 158,161: never 0 to I30 (heating) and I33 (pool) - 0 switches heating off. Not on the allowlist either.
# -V: allowed raw values (x10 for temperatures); I31/I32 only 0/1.
# -R 5: at most one write per register every 5 s.
MBPROXY_ARGS="-s 32 -a 249 -k 199 -w 38,61,92-94,107-109,159-160 -z 158,161 -R 5 -V 38=350..600,61=5..50,92=100..450,93=80..200,94=80..350,107=5..50,108=150..350,109=150..300,159=0..1,160=0..1"
GRACE=60
