# mbproxy configuration, sourced by /usr/flashdisk/etc/rc_users/S50mbproxy.
# Takes effect at the next start (reboot, or S50mbproxy stop + start). Without this file pcod stays in charge.
#
# MBPROXY_ARGS are the options of mbproxy (mbproxy -h lists all of them). Start read-only:
#   -s n        Modbus slave address of the pCO, as set in the controller's BMS menu (default 1)
#   -b / -P     baud rate and parity of the BMS line (default 19200, n) - the values pcod used, see
#               /usr/flashdisk/etc/sysconfig/commcfg or "mbproxy -q" while pcod runs
#   -a / -k     highest holding register / coil the controller has; reads beyond are refused locally
#               (optional, saves bus time when a client asks for too much)
# Writes are refused unless allowed explicitly; only add what you have verified on your controller:
#   -w list     holding registers that may be written, e.g. -w 38,92-94
#   -c list     coils that may be written
#   -V ranges   allowed raw values per register, e.g. -V 38=350..600 (outside -> exception 03)
#   -z list     registers that are never written with 0 (e.g. switches that turn the unit off)
#   -R s        at most one write per address every s seconds (stops a runaway automation)
MBPROXY_ARGS="-s 1"

# seconds pcod keeps running after boot before mbproxy takes over (time to set the kill switch)
GRACE=60
